            - paragraph [ref=e210]: Buglance is a service for digital product owners who want to improve their product quality by hiring testers.
            - generic [ref=e211]: Challenge The application lacked easy access to its main conversion goal - placing a testing order. The form was large and had no accompanying static information to help users during completion, causing serious cognitive load issues.
            - generic [ref=e212]: Action Develop a new flow and design a form interface that would be accessible from any page and solve the issues mentioned above.
            - generic [ref=e213]:
              - text: "Result We designed and developed a new flow:"
              - list [ref=e214]:
                - listitem [ref=e215]: – Simplified the form completion process by dividing it into several steps using Miller's principle (limiting the amount of information processed by short-term memory).
                - listitem [ref=e216]: "– The progress bar at the top gives users a clear understanding of how many steps remain. Jakob Nielsen: Heuristics for UI Design – \"System status should always be visible.\" This increased form completion rates and reduced anxiety levels."
                - listitem [ref=e217]: – Information on the right helps users better understand what is required of them, reducing errors. The principle of minimizing cognitive costs (Hick's Law) – reducing decision-making time through additional context. This decreased the number of incorrectly filled forms and reduced support requests.
                - listitem [ref=e218]: – The popup form allows users to stay on the page. Context Preservation (Miller's Law & Cognitive Load) – allowing users to view additional information without leaving the form, preventing the loss of working memory. This increased the percentage of completed forms and decreased the average time spent filling them out.
                - listitem [ref=e219]: – Significantly impacted form conversion, increasing testing orders by 30% and achieving a SUS score of 89 (Grade A).

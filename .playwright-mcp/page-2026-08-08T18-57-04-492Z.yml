        - generic:
          - generic [ref=e1085]:
            - generic [ref=e1086]: "Challenge The bank ran on branches: every retail operation meant a queue, corporate clients managed salary projects by paperwork, and the core digital initiative had been stalled long enough that nobody expected it to ship. There was no product organisation to restart it with — no research, no product design, no in-house engineering."
            - generic [ref=e1087]: "Action I built that organisation from scratch — research, design, engineering and QA — and led the ecosystem it shipped: the Express24 internet bank and its React Native app, ExpressPay (an e-wallet and payment gateway), the ExpressClub cashback app, an RBAC module that let corporate clients run their own payroll, and internal tools for the branch floor. Discovery came first every time: user interviews before scope, not after."
            - generic [ref=e1088]: "Result Five brands under one architecture, and the numbers behind the shift:"
            - list [ref=e1089]:
              - listitem [ref=e1090]: – Express24 MVP in 4 months — a stalled initiative restarted and shipped; ~30% of daily retail transactions moved from branches to digital channels.
              - listitem [ref=e1091]: – 150+ corporate clients onboarded to manage employee salary projects themselves, through the RBAC module built for it.
              - listitem [ref=e1092]: – Teller transaction time down ~40% — a custom browser extension for receipt printing, found by watching the branch floor rather than reading process docs.
              - listitem [ref=e1093]: – ExpressPay opened a new revenue line and captured the digital-first segment; strict security protocols throughout — 0 critical data breaches.
              - listitem [ref=e1094]: "– Five pillars unified: Expressbank, ExpressPay, Express24, ExpressClub and Expresso cards — one product design language and one brand architecture."

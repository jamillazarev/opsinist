    - article [ref=e92]:
      - generic [ref=e95]:
        - generic [ref=e96]:
          - 'heading "opsinist — run a company of AI agents out of one git repository, any craft: roles, work, cost, evidence and escalation as files" [level=2] [ref=e97]'
          - generic [ref=e98]:
            - generic [ref=e99] [cursor=pointer]: Copy Link
            - generic [ref=e100] [cursor=pointer]: More
        - generic:
          - generic [ref=e101]:
            - generic [ref=e102]: Challenge Most tools for running agent teams ask you to trust a dashboard, creating an opaque layer between the work and the agents doing it. Configurations are hidden, costs are aggregated into a single unhelpful number, and when a run fails, the state is lost with the session.
            - generic [ref=e103]: "Action I designed Opsinist — an operations department expressed as files in a git repository, plus a small set of doors that refuse instead of hoping: stage transitions, outward acts and takeovers are gated by code. It runs any craft — software, a newsletter, a bakery — and instead of promising enforcement, every rule declares what actually holds it: a validator, a hook, the git host, or honestly nothing."
            - generic [ref=e104]: "Result Opsinist enables autonomous companies to run reliably over the long term:"
            - list [ref=e105]:
              - listitem [ref=e106]: "– Git-backed Truth: The entire project state (roles, process, history, budget) is in the repo. Clone the repo, and the whole project comes with it."
              - listitem [ref=e107]: "– Granular Cost Tracking: Costs are tracked per task, role, and release, exposing what was spent on work that produced nothing."
              - listitem [ref=e108]: "– Resilient Execution: A run that dies resumes from its state inventory instead of restarting. Applied work is never redone."
              - listitem [ref=e109]: "– Earned Autonomy: Trust and autonomy move based on evidence in run records. Agents never loosen their own gates."
              - listitem [ref=e110]: "– Honest Enforcement: every gate names what holds it — validator, hook, git host, or prose-only, listed by name. The rules that mattered were measured from 0/5 as prose to hard refusals as hooks."
              - listitem [ref=e111]: "– One Repo, Every Runtime: installs as a plugin into Claude Code, Codex, Gemini CLI and more — the project travels with its repository, not with a tool."
          - generic [ref=e112]:
            - list [ref=e113]:
              - listitem [ref=e114]:

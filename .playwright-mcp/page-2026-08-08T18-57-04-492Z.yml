        - generic:
          - generic [ref=e1064]:
            - generic [ref=e1065]: "Challenge An open-source enterprise blockchain platform had partnerships to win — Visa, Maersk, Bentley — and nothing to show them but architecture diagrams. Proving the platform meant designing the industries it claimed to serve: flows where a wrong state is a legal problem, not a UX inconvenience. There was no design function to do it with."
            - generic [ref=e1066]: "Action I built the design function and put it straight onto the hardest cases: a proof of concept for a uranium marketplace, blockchain-based national voting, and a proprietary crypto wallet. Each PoC ran through a validation framework I set up for the purpose — a concept tested in days, not quarters — so the platform could answer a partner's question with a working flow instead of a promise."
            - generic [ref=e1067]: "Result A design function that produced the platform's most-shown material:"
            - list [ref=e1068]:
              - listitem [ref=e1069]: "– Regulated flows designed end to end: uranium trading and national voting — domains where every state transition answers to law, and the interface has to make the legal state legible."
              - listitem [ref=e1070]: – A PoC validation framework that turned hypotheses into demonstrable concepts in days, which is what a partnership conversation actually needs.
              - listitem [ref=e1071]: – Design systems, brand identities and a crypto wallet delivered as the platform's own product surface.
              - listitem [ref=e1072]: "– Partnerships supported: Visa, Maersk and Bentley — the three names the platform was measured by."
          - generic [ref=e1073]: Design Management, Product Design, Research, Information Architecture, Identity Design, Blockchain, Web App, Design System, Identity, Insolar, 2019–2020
    - article [ref=e1076]:
